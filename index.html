<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Software by derac.">
    <meta name="theme-color" content="#72b6e5">
    <meta property="og:title" content="derac">
    <meta property="og:description" content="Local-first, standard-data, low/no-lib, open source. Information wants to be free.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://derac.org/">
    <meta property="og:image" content="https://derac.org/assets/og-clouds.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The derac logo floating over blue and white clouds">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://derac.org/assets/og-clouds.png">
    <title>derac</title>
    <link rel="icon" href="./favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@800;900&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./index.css?v=20260721-23">
    <script type="module" src="./index.js?v=20260721-23"></script>
  </head>
  <body>
    <canvas id="liquid-light" aria-hidden="true"></canvas>
    <div class="liquid-fallback" aria-hidden="true"></div>
    <div class="mobile-fingertip-cue" aria-hidden="true" style="display: none">
      <img class="mobile-fingertip" src="./assets/fingertip.png" alt="" draggable="false">
    </div>
    <button class="mute-button" type="button" aria-label="Mute sound" aria-pressed="false">
      <svg viewBox="0 0 40 52" aria-hidden="true">
        <path class="bell-cord" d="M20 1v9"></path>
        <g class="bell-clapper">
          <path d="M20 18v22"></path>
          <circle cx="20" cy="43" r="3.4"></circle>
        </g>
        <g class="bell-body">
          <path class="bell-crown" d="M16 10a4 4 0 0 1 8 0v2h-8Z"></path>
          <path class="bell-shell" d="M7 37c3-3 4-8 4-14 0-7 3.7-11 9-11s9 4 9 11c0 6 1 11 4 14-6 4-20 4-26 0Z"></path>
          <path class="bell-rim" d="M7 37c6 3.7 20 3.7 26 0"></path>
        </g>
      </svg>
    </button>

    <main class="portfolio">
      <div class="brand-stage">
        <h1 class="brand">
          <span class="sr-only">derac</span>
          <img src="./assets/title.png" alt="" width="1254" height="600">
        </h1>
        <a class="github-link" href="https://github.com/derac" target="_blank" rel="noreferrer"><span>GitHub</span></a>
      </div>

      <nav class="card-grid" aria-label="Projects">
        <a class="project-card project-card--kwin" href="https://github.com/derac/kwin-clicktile" target="_blank" rel="noreferrer" aria-label="Open kwin-clicktile on GitHub">
          <span class="card-category">KWin / Wayland</span>
          <span class="card-art image-art" aria-hidden="true">
            <img src="./assets/kwin-clicktile-demo.gif" alt="" width="800" height="711">
          </span>
          <span class="card-name">kwin-clicktile</span>
        </a>

        <a class="project-card project-card--fieldloom" href="./fieldloom/" aria-label="Open Field Loom">
          <span class="card-category">WebGPU / Nodes</span>
          <span class="card-art image-art" aria-hidden="true">
            <picture>
              <source srcset="./assets/fieldloom.webp" type="image/webp">
              <img src="./assets/fieldloom.png" alt="" width="1200" height="675">
            </picture>
          </span>
          <span class="card-name">Field Loom</span>
        </a>

        <a class="project-card project-card--turing" href="./turingpatterns/" aria-label="Open Multi-Scale Turing Patterns">
          <span class="card-category">WebGPU / Reaction</span>
          <span class="card-art image-art" aria-hidden="true">
            <picture>
              <source srcset="./assets/turingpatterns.webp" type="image/webp">
              <img src="./assets/turingpatterns.png" alt="" width="1200" height="675">
            </picture>
          </span>
          <span class="card-name">Turing Patterns</span>
        </a>

        <a class="project-card project-card--snapdragin" href="https://github.com/derac/snapdragin" target="_blank" rel="noreferrer" aria-label="Open Snapdragin on GitHub">
          <span class="card-category">Windows / Rust</span>
          <span class="card-art image-art" aria-hidden="true">
            <video autoplay muted loop playsinline preload="auto">
              <source src="./assets/snapdragin-demo.mp4" type="video/mp4">
              <source src="./assets/snapdragin-demo.webm" type="video/webm">
            </video>
          </span>
          <span class="card-name">Snapdragin</span>
        </a>
      </nav>
    </main>
  </body>
</html>
