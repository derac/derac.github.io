    });

    const div=document.createElement('div'); div.className='panel';
    const hd=document.createElement('div'); hd.className='ph';
    const t=document.createElement('h2'); t.textContent=b.t; hd.appendChild(t);
    div.appendChild(hd);

    const wr=document.createElement('div'); wr.className='tw';
    const tb=document.createElement('table'); tb.className='sortable';
    const thd=document.createElement('thead'); const thr=document.createElement('tr');

    const cols=[{k:'model',l:'Model'},{k:'score',l:'Score'},{k:'cost',l:'Cost'},{k:'latency',l:'Latency'},{k:'tokens',l:'Tokens'}];
    cols.forEach(col=>{
      const th=document.createElement('th'); th.textContent=col.l;
      if(col.k===st.col){th.classList.add('sorted');th.textContent+=st.asc?' \u25b2':' \u25bc';}
      th.addEventListener('click',()=>{
        if(st.col===col.k) st.asc=!st.asc;
        else{st.col=col.k;st.asc=!!SORT_DEF[col.k];}
        renderAll();
      });
      thr.appendChild(th);
    });
    thd.appendChild(thr); tb.appendChild(thd);

    const tbd=document.createElement('tbody');
    rows.forEach(r=>{
      const tr=document.createElement('tr');
      if(r.m===anchor.m&&r.lv===anchor.l) tr.className='selected';
      tr.addEventListener('click',()=>{anchor={m:r.m,l:r.lv};ancLabel.textContent=anchor.m+' \u00b7 '+lvL(anchor.l);renderAll();});
      const tdM=document.createElement('td'); tdM.textContent=r.m+' \u00b7 '+lvL(r.lv); tr.appendChild(tdM);

      ['s','c','l','t'].forEach(k=>{
        const td=document.createElement('td');
        const val=r.cel[k];
        if(val!=null){
          const display=k==='s'?fmtScore(val,b):[fmtCost,fmtLat,fmtTok][{c:0,l:1,t:2}[k]](val);
          const base=a[k];
          let scale;
          if(base!=null&&base!==0){
            const raw=k==='s'?s0(val):val;
            const baseRaw=k==='s'?s0(base):base;
            scale=fs(raw/baseRaw);
          }else scale='\u00d7\u2014';
          const sc=k==='s'?'sc':k==='c'?'co':k==='l'?'la':'to';
          td.innerHTML=display+' <span class="sf '+sc+'">'+scale+'</span>';
        }else td.textContent='\u2014';
        tr.appendChild(td);
      });
      tbd.appendChild(tr);
    });
    tb.appendChild(tbd); wr.appendChild(tb); div.appendChild(wr);
    return div;
  }

  function renderTabular(){ ancBar.style.display=''; root.replaceChildren(); S.b.forEach(b=>{if(hasVisibleData(b))root.appendChild(tabPanel(b));}); }

  // ── Model / Level filter ──
  function renderFilterBar(){
    const bar=document.getElementById('filterBar');
    bar.replaceChildren();

    // Row 1: All / None
    const r1=document.createElement('div'); r1.className='filter-row';
    const allBtn=document.createElement('span'); allBtn.className='filter-ctrl'; allBtn.textContent='All';
    allBtn.addEventListener('click',()=>{visibleModels=new Set(allModelNames);visibleLevels=new Set(allLevels);renderAll();});
    r1.appendChild(allBtn);
    const noneBtn=document.createElement('span'); noneBtn.className='filter-ctrl'; noneBtn.textContent='None';
    noneBtn.addEventListener('click',()=>{visibleModels=new Set();visibleLevels=new Set();renderAll();});
    r1.appendChild(noneBtn);
    bar.appendChild(r1);

    // Row 2: Models
    const r2=document.createElement('div'); r2.className='filter-row';
    const mM=document.createElement('span'); mM.style.cssText='color:var(--muted);font-size:15px;font-weight:600;'; mM.textContent='Models:';
    r2.appendChild(mM);
    allBaseNames.forEach(base=>{
      const vars=variantsOf(base);
      const anyOn=vars.some(m=>visibleModels.has(m));
      const chip=document.createElement('span'); chip.className='filter-chip'+(anyOn?' on':' off'); chip.textContent=base;
      chip.addEventListener('click',()=>{
        const on=vars.some(m=>visibleModels.has(m));
        vars.forEach(m=>{if(on)visibleModels.delete(m);else visibleModels.add(m);});
        renderAll();
      });
      r2.appendChild(chip);
    });
    bar.appendChild(r2);

    // Row 3: Levels
    const r3=document.createElement('div'); r3.className='filter-row';
    const mL=document.createElement('span'); mL.style.cssText='color:var(--muted);font-size:15px;font-weight:600;'; mL.textContent='Levels:';
    r3.appendChild(mL);
    allLevels.forEach(lv=>{
      const label={none:'None',low:'Low',medium:'Medium',high:'High',xhigh:'Xhigh',max:'Max'}[lv];
      const on=visibleLevels.has(lv);
      const chip=document.createElement('span'); chip.className='filter-chip'+(on?' on':' off'); chip.textContent=label;
      chip.addEventListener('click',()=>{
        if(visibleLevels.has(lv)) visibleLevels.delete(lv); else visibleLevels.add(lv);
        renderAll();
      });
      r3.appendChild(chip);
    });
    bar.appendChild(r3);
  }

  // ── Render dispatch ──
  function renderAll(){
    renderFilterBar();
    renderTabular();
  }

  renderAll();
})();
</script>
</body>
</html>
